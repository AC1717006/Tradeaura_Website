name: News Hub — Auto Refresh

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'   # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:               # Manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Check auto-publish flag
        id: check_flag
        run: |
          if [ -f "data/auto-publish-disabled" ]; then
            echo "disabled=true" >> $GITHUB_OUTPUT
            echo "⏸  Auto-publish is disabled. Skipping."
          else
            echo "disabled=false" >> $GITHUB_OUTPUT
          fi

      - name: Fetch news, curate & rewrite
        if: steps.check_flag.outputs.disabled == 'false'
        env:
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          CURRENTS_API_KEY:   ${{ secrets.CURRENTS_API_KEY }}
          NEWSDATA_API_KEY:   ${{ secrets.NEWSDATA_API_KEY }}
          NEWS_API_KEY:       ${{ secrets.NEWS_API_KEY }}
        run: node scripts/fetch-news.js

      - name: Detect changes
        id: changes
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit generated pages
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "TradeAura News Bot"
          git config user.email "bot@auraautomation.site"
          git add data/news.json news/ index.html sitemap.xml
          git commit -m "chore(news): auto-publish [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push

      - name: No new content
        if: steps.changes.outputs.changed == 'false'
        run: echo "ℹ️ No changes — nothing to commit."
